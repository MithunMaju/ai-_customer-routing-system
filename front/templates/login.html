<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form id="login-form">
        <input
            type="text"
            id="username"
            placeholder="Username"
        >
        <br><br>
        <input
            type="password"
            id="password"
            placeholder="Password"
        >
        <br><br>
        <button type="submit">
            Login
        </button>
    </form>

    <script>
        const form = document.getElementById('login-form')
        form.addEventListener('submit',
                async function(event) {
                    event.preventDefault()
                    const username=document.getElementById('username').value
                const password=document.getElementById('password').value
                const response = await fetch('/api/token/',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                )
                const data =
    await response.json()
if (response.ok) {
    localStorage.setItem(
        'access',
        data.access
    )
    window.location.href =
        '/request/'
}
else {
    alert(
        'Invalid username or password'
    )

}
                })
    </script>
</body>
</html>
